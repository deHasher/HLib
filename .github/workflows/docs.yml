name: "docs"

on:
  push:
    branches: ["master"]
    paths: ["docs/**", "README.md", "gradle.properties", "scripts/render-docs.py", ".github/workflows/docs.yml"]
  pull_request:
    paths: ["docs/**", "README.md", "gradle.properties", "scripts/render-docs.py", ".github/workflows/docs.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "docs-${{ github.event_name == 'pull_request' && github.ref || 'master' }}"
  cancel-in-progress: false

jobs:
  check:
    runs-on: "ubuntu-latest"
    steps:
      - name: "Checkout documentation sources"
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: "Render and check documentation"
        run: |
          python3 scripts/render-docs.py
          python3 scripts/render-docs.py --check

  publish-docs:
    needs: "check"
    if: github.ref == 'refs/heads/master' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: "ubuntu-latest"
    permissions:
      contents: write
    steps:
      - name: "Checkout current documentation sources"
        uses: actions/checkout@v6
        with:
          ref: "master"

      - name: "Checkout Wiki"
        uses: actions/checkout@v6
        with:
          repository: "${{ github.repository }}.wiki"
          ref: "master"
          path: ".wiki"

      - name: "Update README and render Wiki"
        shell: "bash"
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for ATTEMPT in {1..5}; do
          	git fetch --no-tags origin master
          	git reset --hard origin/master
          	python3 scripts/render-docs.py --wiki-dir .wiki
          	python3 scripts/render-docs.py --check
          	git add -- README.md
          	if git diff --cached --quiet; then
          		break
          	fi
          	git commit -m "Автоматическое обновление README из свойств проекта."
          	if git push origin HEAD:master; then
          		break
          	fi
          	if [ "$ATTEMPT" -eq 5 ]; then
          		exit 1
          	fi
          done

      - name: "Publish Wiki"
        shell: "bash"
        run: |
          while IFS= read -r -d "" TEMPLATE; do
            git -C .wiki add -- "${TEMPLATE#docs/wiki/}"
          done < <(find docs/wiki -type f -name "*.md" -print0)
          if ! git -C .wiki diff --cached --quiet; then
            git -C .wiki config user.name "github-actions[bot]"
            git -C .wiki config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git -C .wiki commit -m "Автоматическое обновление документации проекта."
            git -C .wiki push origin HEAD:master
          fi